services:
  food-grocery-mcp:
    # The accepted Woolworths Chromium session runs on the host and keeps CDP
    # loopback-only. Host networking lets this one container reach that socket
    # without publishing browser control to the LAN.
    network_mode: host
    ports: !reset []
    extra_hosts: !reset []
    environment:
      PORT: ${GROCERY_MCP_HOST_PORT:-8790}
      WOOLWORTHS_CDP_URL: ${WOOLWORTHS_CDP_URL:-http://127.0.0.1:9224}
      # This bridge has host networking, so reach the loopback-only Coles
      # catalogue proxy through its published host port rather than Docker DNS.
      COLES_BROWSER_FETCH_URL: ${COLES_BROWSER_FETCH_URL:-http://127.0.0.1:8788/fetch}
